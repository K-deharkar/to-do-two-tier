version: '3.8'

services:
  db:
    image: mysql:8.4
    container_name: todo_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: todo_db
      MYSQL_USER: todo_user
      MYSQL_PASSWORD: password123
    ports:
      - "3306:3306"
    networks:
      - todo_net
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

  backend:
    build: ./backend
    container_name: todo_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      DB_HOST: db
      DB_USER: todo_user
      DB_PASSWORD: password123
      DB_NAME: todo_db
    networks:
      - todo_net
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: todo_frontend
    restart: always
    ports:
      - "8080:80"
    networks:
      - todo_net
    depends_on:
      - backend

networks:
  todo_net:
    driver: bridge

volumes:
  mysql_data:
